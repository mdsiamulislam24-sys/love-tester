<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: pink;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-box {
            background: white;
            padding: 35px;
            width: 320px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 0 20px gray;
        }

        h1 {
            color: red;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid pink;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            padding: 12px 30px;
            margin-top: 15px;
            background: red;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
        }

        #message {
            margin-top: 15px;
            color: red;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>🔐 Admin Login</h1>

        <input type="text" id="username" placeholder="Username">

        <input type="password" id="password" placeholder="Password">

        <br>

        <button onclick="login()">Login</button>

        <p id="message"></p>

    </div>

    <script>

        function login() {

    let username = document.getElementById("username").value;
    let password = document.getElementById("password").value;

    fetch("/admin-login", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            username: username,
            password: password
        })

    })
    .then(response => response.json())
    .then(data => {

        if (data.success) {

    sessionStorage.setItem("adminLoggedIn", "true");

    window.location.href = "admin.html";

}
 else {

            document.getElementById("message").innerHTML =
                "❌ Wrong username or password!";

        }

    });

}

    </script>

</body>

</html>
